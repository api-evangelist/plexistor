name: Plexistor
description: >-
  Plexistor was an enterprise storage startup that built Software-Defined Memory
  (SDM) - a converged memory-and-storage architecture delivering ultra-low
  latency and millions of IOPS on commodity servers by tiering across DRAM,
  NVDIMM-N, Intel/Micron 3D XPoint, flash, and spinning disk. It positioned SDM
  as a persistent-memory storage layer for big-data workloads such as Cassandra,
  Couchbase, and Spark, adding enterprise features like snapshots, clones, high
  availability, and clustering. The company was acquired by NetApp in 2017 and
  its technology was folded into NetApp's memory/storage roadmap. The plexistor.com
  site survives as a static legacy marketing page with no active product download,
  API, SDK, or developer portal. This profile was surfaced as a portfolio company
  of Battery Ventures and Lightspeed Venture Partners and enriched by the API
  Evangelist pipeline; the honest result is that Plexistor exposes no public API
  surface.
